<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Slide 7</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 60px;
            margin: 0;
        }
        h1 {
            color: #667eea;
            font-size: 42px;
            margin-bottom: 30px;
        }
        .steps {
            counter-reset: step-counter;
            list-style: none;
            padding: 0;
        }
        .steps li {
            counter-increment: step-counter;
            margin-bottom: 30px;
            padding-left: 80px;
            position: relative;
            font-size: 26px;
        }
        .steps li:before {
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: 0;
            background: #667eea;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h1>Proceso de Desarrollo de Estrategias</h1>
    <ul class="steps">
        <li>Definir la hipótesis de trading</li>
        <li>Recopilar y preparar los datos</li>
        <li>Implementar la estrategia en código</li>
        <li>Realizar backtesting riguroso</li>
        <li>Optimizar parámetros</li>
        <li>Validar en datos fuera de muestra</li>
        <li>Implementar en entorno real (paper trading)</li>
    </ul>
</body>
</html>
