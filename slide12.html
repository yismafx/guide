<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Slide 12</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 60px;
            margin: 0;
        }
        h1 {
            color: #667eea;
            font-size: 42px;
            margin-bottom: 30px;
        }
        .timeline {
            position: relative;
            padding-left: 40px;
        }
        .timeline:before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #667eea;
        }
        .timeline-item {
            position: relative;
            padding-left: 40px;
            margin-bottom: 40px;
        }
        .timeline-item:before {
            content: '';
            position: absolute;
            left: -10px;
            top: 5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
        }
        .timeline-item h3 {
            color: #764ba2;
            font-size: 28px;
            margin: 0 0 10px 0;
        }
        .timeline-item p {
            font-size: 24px;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Roadmap del Curso</h1>
    <div class="timeline">
        <div class="timeline-item">
            <h3>Módulo 1</h3>
            <p>Fundamentos de Python para Trading</p>
        </div>
        <div class="timeline-item">
            <h3>Módulo 2</h3>
            <p>Análisis Técnico y Datos Financieros</p>
        </div>
        <div class="timeline-item">
            <h3>Módulo 3</h3>
            <p>Desarrollo de Estrategias</p>
        </div>
        <div class="timeline-item">
            <h3>Módulo 4</h3>
            <p>Backtesting y Optimización</p>
        </div>
        <div class="timeline-item">
            <h3>Módulo 5</h3>
            <p>Integración de IA Generativa</p>
        </div>
        <div class="timeline-item">
            <h3>Módulo 6</h3>
            <p>Implementación en Producción</p>
        </div>
    </div>
</body>
</html>
