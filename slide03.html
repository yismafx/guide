<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
:root {
  --color-primary: #2563EB;
  --color-secondary: #7C3AED;
  --color-success: #10B981;
  --color-danger: #EF4444;
  --color-warning: #F59E0B;
  --color-neutral: #6B7280;
  --color-dark: #1E293B;
  --color-light: #F1F5F9;
  --color-white: #FFFFFF;
  --font-primary: Arial, sans-serif;
  --size-xl: 48px;
  --size-lg: 36px;
  --size-md: 24px;
  --size-sm: 18px;
  --size-xs: 14px;
  --space-xl: 60px;
  --space-lg: 40px;
  --space-md: 24px;
  --space-sm: 16px;
  --space-xs: 8px;
}
  </style>
</head>
<body style="width: 960px; height: 540px; margin: 0; padding: 30px 40px 40px 40px; background: var(--color-white); font-family: var(--font-primary);">
  <h1 style="font-size: 38px; color: var(--color-primary); margin: 0 0 20px 0; font-weight: bold;">LAS 5 FASES DEL TRADING ALGORÍTMICO</h1>
  
  <div class="row" style="display: flex; gap: 10px; height: 340px; margin-bottom: 12px;">
    <div style="flex: 1; background: var(--color-primary); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 24px; color: var(--color-white); margin: 0; font-weight: bold; text-align: center;">📊 FASE 1</p>
      <p style="font-size: 15px; color: var(--color-white); margin: 6px 0 0 0; text-align: center;">INVESTIGACIÓN & DISEÑO</p>
    </div>
    
    <div style="flex: 1; background: var(--color-success); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 24px; color: var(--color-white); margin: 0; font-weight: bold; text-align: center;">🔬 FASE 2</p>
      <p style="font-size: 15px; color: var(--color-white); margin: 6px 0 0 0; text-align: center;">BACKTESTING</p>
    </div>
    
    <div style="flex: 1; background: var(--color-secondary); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 24px; color: var(--color-white); margin: 0; font-weight: bold; text-align: center;">⚙️ FASE 3</p>
      <p style="font-size: 15px; color: var(--color-white); margin: 6px 0 0 0; text-align: center;">OPTIMIZACIÓN</p>
    </div>
    
    <div style="flex: 1; background: var(--color-warning); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 24px; color: var(--color-white); margin: 0; font-weight: bold; text-align: center;">📝 FASE 4</p>
      <p style="font-size: 15px; color: var(--color-white); margin: 6px 0 0 0; text-align: center;">PAPER TRADING</p>
    </div>
    
    <div style="flex: 1; background: var(--color-danger); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 24px; color: var(--color-white); margin: 0; font-weight: bold; text-align: center;">💰 FASE 5</p>
      <p style="font-size: 15px; color: var(--color-white); margin: 6px 0 0 0; text-align: center;">LIVE TRADING</p>
    </div>
    
    <div style="flex: 1; background: var(--color-neutral); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 24px; color: var(--color-white); margin: 0; font-weight: bold; text-align: center;">🔄</p>
      <p style="font-size: 15px; color: var(--color-white); margin: 6px 0 0 0; text-align: center;">MONITOREO & AJUSTE</p>
    </div>
  </div>
  
  <div style="background: var(--color-light); padding: 12px; border-radius: 8px; text-align: center;">
    <p style="font-size: 16px; color: var(--color-dark); margin: 0; font-style: italic;">"No hay atajos. Cada fase tiene su propósito."</p>
  </div>
</body>
</html>
