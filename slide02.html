<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Slide 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 60px;
            margin: 0;
        }
        h1 {
            color: #667eea;
            font-size: 42px;
            margin-bottom: 30px;
        }
        ul {
            font-size: 28px;
            line-height: 1.8;
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 20px;
            padding-left: 40px;
            position: relative;
        }
        li:before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #667eea;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <h1>Objetivos del Curso</h1>
    <ul>
        <li>Comprender los fundamentos del trading algorítmico</li>
        <li>Integrar IA Generativa en estrategias de trading</li>
        <li>Desarrollar sistemas de trading automatizados</li>
        <li>Aplicar técnicas de análisis de datos financieros</li>
    </ul>
</body>
</html>
