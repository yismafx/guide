<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
:root {
  --color-primary: #2563EB;
  --color-secondary: #7C3AED;
  --color-success: #10B981;
  --color-danger: #EF4444;
  --color-warning: #F59E0B;
  --color-neutral: #6B7280;
  --color-dark: #1E293B;
  --color-light: #F1F5F9;
  --color-white: #FFFFFF;
  --font-primary: Arial, sans-serif;
  --size-xl: 48px;
  --size-lg: 36px;
  --size-md: 24px;
  --size-sm: 18px;
  --size-xs: 14px;
  --space-xl: 60px;
  --space-lg: 40px;
  --space-md: 24px;
  --space-sm: 16px;
  --space-xs: 8px;
}
  </style>
</head>
<body style="width: 960px; height: 540px; margin: 0; padding: 30px 40px; background: var(--color-white); font-family: var(--font-primary);">
  <div style="height: 100%;">
    <h1 style="font-size: var(--size-xl); color: var(--color-primary); margin: 0 0 20px 0; font-weight: bold;">EL MENSAJE CENTRAL</h1>
    
    <div style="background: var(--color-light); padding: 20px; border-radius: 12px; margin-bottom: 16px;">
      <p style="font-size: var(--size-md); color: var(--color-dark); margin: 0; font-weight: 500; text-align: center; line-height: 1.3;">
        "La IA Generativa NO reemplaza los fundamentos del trading algorítmico; los <b style="color: var(--color-primary);">AUMENTA</b>"
      </p>
    </div>

    <div class="row" style="display: flex; gap: 16px; margin-bottom: 16px;">
      <div style="flex: 1; background: #FEE2E2; padding: 16px; border-radius: 8px;">
        <h3 style="font-size: var(--size-sm); color: var(--color-danger); margin: 0 0 8px 0; font-weight: bold;">Bot Tradicional</h3>
        <p style="font-size: 16px; color: var(--color-dark); margin: 0;">✗ CIEGO (sigue órdenes)</p>
      </div>
      
      <div style="flex: 1; background: #D1FAE5; padding: 16px; border-radius: 8px;">
        <h3 style="font-size: var(--size-sm); color: var(--color-success); margin: 0 0 8px 0; font-weight: bold;">TA Aumentado</h3>
        <p style="font-size: 16px; color: var(--color-dark); margin: 4px 0;">✓ VE (analiza)</p>
        <p style="font-size: 16px; color: var(--color-dark); margin: 4px 0;">✓ RAZONA (genera hipótesis)</p>
        <p style="font-size: 16px; color: var(--color-dark); margin: 4px 0;">✓ ACELERA (escribe código)</p>
      </div>
    </div>

    <div style="background: linear-gradient(90deg, var(--color-warning) 0%, #FCD34D 100%); padding: 16px; border-radius: 8px; text-align: center;">
      <p style="font-size: 20px; color: var(--color-dark); margin: 0; font-weight: bold;">💡 IA Generativa = COPILOTO, NO Piloto Automático</p>
    </div>
  </div>
</body>
</html>
