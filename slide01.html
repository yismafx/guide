<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
:root {
  --color-primary: #2563EB;
  --color-secondary: #7C3AED;
  --color-success: #10B981;
  --color-danger: #EF4444;
  --color-warning: #F59E0B;
  --color-neutral: #6B7280;
  --color-dark: #1E293B;
  --color-light: #F1F5F9;
  --color-white: #FFFFFF;
  --font-primary: Arial, sans-serif;
  --size-xl: 48px;
  --size-lg: 36px;
  --size-md: 24px;
  --size-sm: 18px;
  --size-xs: 14px;
  --space-xl: 60px;
  --space-lg: 40px;
  --space-md: 24px;
  --space-sm: 16px;
  --space-xs: 8px;
}
  </style>
</head>
<body style="width: 960px; height: 540px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%); font-family: var(--font-primary);">
  <div style="text-align: center; color: var(--color-white); padding: var(--space-lg);">
    <h1 style="font-size: 52px; margin: 0 0 var(--space-md) 0; font-weight: bold; line-height: 1.2;">TRADING ALGORÍTMICO AUMENTADO CON IA GENERATIVA</h1>
    <h2 style="font-size: var(--size-lg); margin: 0 0 var(--space-xl) 0; font-weight: 300; opacity: 0.95;">De Trader Manual a Desarrollador de Sistemas Inteligentes</h2>
    <div style="margin-top: var(--space-xl); padding-top: var(--space-md); border-top: 3px solid rgba(255,255,255,0.3);">
      <p style="font-size: var(--size-md); margin: var(--space-sm) 0;">Yismary Quintero</p>
      <p style="font-size: var(--size-sm); margin: var(--space-xs) 0; opacity: 0.9;">15 Noviembre - 12 Diciembre 2025</p>
    </div>
  </div>
</body>
</html>
