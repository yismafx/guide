<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Slide 8</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            padding: 60px;
            margin: 0;
        }
        h1 {
            color: #764ba2;
            font-size: 42px;
            margin-bottom: 30px;
        }
        .warning-box {
            background-color: #fff3cd;
            border-left: 6px solid #ffc107;
            padding: 30px;
            margin: 30px 0;
        }
        .warning-box h2 {
            color: #856404;
            margin-top: 0;
            font-size: 32px;
        }
        .warning-box ul {
            font-size: 24px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <h1>Riesgos y Consideraciones</h1>
    <div class="warning-box">
        <h2>⚠️ Factores de Riesgo</h2>
        <ul>
            <li>Overfitting: ajustar demasiado a datos históricos</li>
            <li>Costos de transacción no considerados</li>
            <li>Slippage: diferencia entre precio esperado y ejecutado</li>
            <li>Riesgo de mercado y volatilidad</li>
            <li>Fallos técnicos del sistema</li>
            <li>Cambios regulatorios</li>
        </ul>
    </div>
</body>
</html>
