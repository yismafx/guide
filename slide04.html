<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Slide 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 60px;
            margin: 0;
        }
        h1 {
            color: #667eea;
            font-size: 42px;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h3 {
            color: #764ba2;
            margin-top: 0;
            font-size: 28px;
        }
        .card p {
            font-size: 22px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Componentes del Trading Algorítmico</h1>
    <div class="grid">
        <div class="card">
            <h3>📊 Datos</h3>
            <p>Información histórica y en tiempo real de los mercados</p>
        </div>
        <div class="card">
            <h3>🧠 Estrategia</h3>
            <p>Reglas y lógica para tomar decisiones de trading</p>
        </div>
        <div class="card">
            <h3>⚡ Ejecución</h3>
            <p>Sistema que envía órdenes al mercado</p>
        </div>
        <div class="card">
            <h3>📈 Backtesting</h3>
            <p>Prueba de la estrategia con datos históricos</p>
        </div>
    </div>
</body>
</html>
